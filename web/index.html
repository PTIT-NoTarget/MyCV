<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Ôn tập câu hỏi phỏng vấn Java, Spring, hệ thống phân tán" />
    <title>Câu hỏi phỏng vấn</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body class="app-body">
    <a class="visually-hidden-focusable btn btn-primary position-fixed top-0 start-0 m-2 z-3 skip-link" href="#main"
      >Bỏ qua điều hướng</a
    >

    <div class="container-xxl px-3 px-md-4 py-3 py-md-4">
      <header class="border-bottom pb-3 pb-md-4 mb-3 mb-md-4">
        <h1 class="h3 mb-2 fw-bold" id="app-title">Câu hỏi phỏng vấn</h1>
        <p class="text-secondary small mb-3 mb-md-4" id="app-desc"></p>

        <div class="row g-2 g-md-3 align-items-stretch align-items-md-center">
          <div class="col-12 col-md">
            <label class="form-label visually-hidden" for="search-input">Tìm kiếm</label>
            <input
              type="search"
              id="search-input"
              class="form-control"
              placeholder="Tìm trong câu hỏi và gợi ý…"
              autocomplete="off"
            />
          </div>
          <div class="col-12 col-sm-auto">
            <button type="button" class="btn btn-outline-secondary w-100 w-sm-auto" id="theme-toggle" aria-label="Đổi giao diện sáng/tối">
              <span class="theme-icon" aria-hidden="true">◐</span>
              <span class="d-none d-sm-inline ms-1 theme-label">Giao diện</span>
            </button>
          </div>
        </div>
        <p class="small text-secondary mt-3 mb-0 header__hint">
          Danh sách chỉ hiện câu hỏi — bấm vào một dòng để mở hoặc thu gợi ý trả lời. Khi tìm kiếm, các mục khớp sẽ mở sẵn để dễ đọc.
        </p>
      </header>

      <div class="d-lg-none mb-3">
        <button
          type="button"
          class="btn btn-outline-primary w-100 py-2 d-flex align-items-center justify-content-center gap-2"
          data-bs-toggle="offcanvas"
          data-bs-target="#tocOffcanvas"
          aria-controls="tocOffcanvas"
        >
          <span class="toc-burger" aria-hidden="true"></span>
          Mục lục — chọn phần ôn tập
        </button>
      </div>

      <div class="row g-0 g-lg-4 align-items-start">
        <main class="col-12 col-lg-9 order-1 order-lg-2" id="main">
          <article class="card border-0 shadow-sm">
            <div class="card-body p-3 p-md-4" id="content">
              <p class="text-secondary mb-0">Đang tải dữ liệu…</p>
            </div>
          </article>
        </main>

        <aside class="col-12 col-lg-3 order-2 order-lg-1 p-lg-0" aria-label="Mục lục phần">
          <div
            class="offcanvas-lg offcanvas-start toc-offcanvas"
            tabindex="-1"
            id="tocOffcanvas"
            aria-labelledby="tocOffcanvasLabel"
          >
            <div class="offcanvas-header border-bottom d-lg-none">
              <h2 class="offcanvas-title h6 mb-0" id="tocOffcanvasLabel">Mục lục</h2>
              <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Đóng"></button>
            </div>
            <div class="offcanvas-body d-flex flex-column p-0">
              <p class="d-none d-lg-block small text-uppercase text-secondary fw-semibold mb-2 px-3 pt-1 mb-lg-2 toc-desktop-heading">
                Mục lục
              </p>
              <nav class="toc-nav flex-grow-1" aria-label="Mục lục">
                <div id="section-list" class="list-group list-group-flush border-0 rounded-0"></div>
              </nav>
            </div>
          </div>
        </aside>
      </div>

      <footer class="border-top mt-4 pt-3 small text-secondary">
        <span>Nguồn: <code>interview.md</code> — cập nhật qua GitHub Actions</span>
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="js/index.js" defer></script>
  </body>
</html>
